# Splits the old .woodpecker.yml's single linear step (format+lint+mypy+
# build all in one `ci` step, matrixed across Python 3.10-3.13) into
# separate steps that run in parallel via Woodpecker's depends_on DAG
# mode, matching atklab/enochecker-exploit's .woodpecker/ci.yaml.
#
# The old pipeline matrixed across Python 3.10-3.13 by picking a
# different `image: python:${PYTHON_VERSION}` per run. A baked CI image
# (this repo's own .woodpecker/Dockerfile) can't do that without either
# building N images or installing N interpreters into one, so this runs
# once against 3.13 (the Dockerfile's base, and the newest supported
# version) -- the same one-version tradeoff already made on this repo's
# src4/ci branch (.src4-ci.yml) and by enochecker-exploit's own
# .woodpecker/ci.yaml.
#
# `ci-image` builds and pushes the .woodpecker/Dockerfile runner image
# itself (same as the justfile's ci-image-build/ci-image-push recipes,
# run by hand), via woodpeckerci/plugin-docker-buildx rather than a raw
# `docker:dind` step + hand-rolled `docker build`/`docker push` -- the
# plugin brings its own embedded buildkit (still fine under this
# agent's sysbox runtime, same as the old dind approach) and handles
# registry login itself from the `username`/`password` settings below,
# instead of relying on oci.atklab.cloud being registered as a registry
# in this repo's Woodpecker project settings out of band. Creds come
# from the REGISTRY_USERNAME/REGISTRY_PASSWORD Woodpecker secrets
# (provisioned out of band, per-repo or org-wide). The step only runs
# when .woodpecker/Dockerfile changed (`when.path`); the check steps
# depend on it with `optional: true` so they still run when it's
# skipped, and set `pull: true` so a pipeline that did rebuild the
# image picks up the fresh `:latest` instead of a stale cached copy.

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  ci-image:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: oci.atklab.cloud/enochecker-core/enochecker-core-ci
      tags: latest
      dockerfile: .woodpecker/Dockerfile
      context: .
      registry: oci.atklab.cloud
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
    when:
      - path: .woodpecker/Dockerfile

  format:
    image: oci.atklab.cloud/enochecker-core/enochecker-core-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
    depends_on:
      - name: ci-image
        optional: true
    commands:
      - just -v format

  lint:
    image: oci.atklab.cloud/enochecker-core/enochecker-core-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
    depends_on:
      - name: ci-image
        optional: true
    commands:
      - just -v lint

  mypy:
    image: oci.atklab.cloud/enochecker-core/enochecker-core-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
    depends_on:
      - name: ci-image
        optional: true
    commands:
      - just -v mypy

  test:
    image: oci.atklab.cloud/enochecker-core/enochecker-core-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
    depends_on:
      - name: ci-image
        optional: true
    commands:
      - just -v test

  build:
    image: oci.atklab.cloud/enochecker-core/enochecker-core-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
    depends_on:
      - name: ci-image
        optional: true
    commands:
      - just -v build
      - pip install dist/enochecker_core-*.tar.gz
