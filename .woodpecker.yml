when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

matrix:
  PYTHON_VERSION:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"

steps:
  ci:
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: --exact --isolated --frozen
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends ca-certificates curl
      - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      - python -m pip install uv==0.8.5
      - just -v format
      - just -v lint
      - just -v mypy
      - just -v build
      - pip install dist/enochecker_core-*.tar.gz
