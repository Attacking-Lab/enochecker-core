when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

matrix:
  PYTHON_VERSION:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"

steps:
  ci:
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: --exact --isolated --frozen
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends make
      - python -m pip install uv==0.8.5
      - make --trace format
      - make --trace lint
      - make --trace mypy
      - make --trace build
      - pip install dist/enochecker_core-*.tar.gz
